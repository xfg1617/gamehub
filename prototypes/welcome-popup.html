<!-- Approved design (Inna, Nov 2026) for the guest welcome pop-up. Not built yet. Show once to guests on their first visit
     (never on invite links); "Maybe later" hides it; maybe once more after a first win. Needs unlockable avatars + badges. -->
<!doctype html><html><head><meta charset="utf-8"><style>
.wl-back { position: fixed; inset: 0; z-index: 90; background: rgba(5,14,24,.7); display: flex; align-items: center; justify-content: center; padding: 16px; }
.wl { width: min(380px, 100%); }
.wl-bd { padding: 16px 18px 14px; text-align: center; }
.wl-bd h3 { font-family: Outfit, sans-serif; font-weight: 800; font-size: 20px; color: #F7F4EC; line-height: 1.2; }
.wl-bd p { color: #9DB4CC; font-size: 13px; margin-top: 4px; }
.wl-perks { display: flex; justify-content: center; gap: 8px; margin: 14px 0; }
.wl-perks div { flex: 1; background: #0B1B2B; border: 2px solid #050E18; padding: 8px 4px; }
.wl-perks span { display: block; font-size: 22px; }
.wl-perks b { display: block; font-size: 11px; color: #F7F4EC; margin-top: 2px; }
.wl-later { color: #9DB4CC; font-size: 12px; text-decoration: underline; margin-top: 10px; }
</style></head><body style="background:#0B1B2B">
<div class="wl-back"><div class="win wl">
  <div class="winbar amber"><span>WELCOME!</span><button class="pix text-sm">✕</button></div>
  <div class="wl-bd">
    <h3>Save your progress</h3>
    <p>Make a free account to keep what you earn.</p>
    <div class="wl-perks"><div><span>💾</span><b>Progress</b></div><div><span>🦄</span><b>Avatars</b></div><div><span>🏅</span><b>Badges</b></div></div>
    <button class="btn-game btn-amber w-full py-2.5 text-sm">Create free account</button>
    <button class="pix text-xs text-amber mt-3 block mx-auto">I already have an account</button>
    <button class="wl-later">Maybe later</button>
  </div>
</div></div></body></html>
